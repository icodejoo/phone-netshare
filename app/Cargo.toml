[package]
name = "phone-netshare"
version = "0.1.1"
edition = "2024"

[dependencies]
muda = "0.21.2"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_Ime",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
